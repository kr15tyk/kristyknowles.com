<!doctype html>
<html lang="en">
  <head>

    <title>Page not found — Kristy Knowles</title>
    <style>
      :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      body { display: grid; min-height: 100vh; margin: 0; place-items: center; background: #f6f0e5; color: #2c173a; }
      main { width: min(620px, calc(100% - 40px)); padding: 42px; border: 3px solid #2c173a; background: #fffaf3; box-shadow: 10px 12px 0 #b9533e; }
      span { color: #b9533e; font-size: .75rem; font-weight: 900; letter-spacing: .14em; text-transform: uppercase; }
      h1 { margin: 12px 0; font: 500 clamp(2.7rem, 8vw, 5.6rem)/.95 Georgia, serif; }
      p { color: #6f645f; font-size: 1.08rem; }
      a { display: inline-block; margin-top: 14px; padding: 11px 17px; border-radius: 999px; background: #2c173a; color: #fffaf3; font-weight: 800; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <span>404 · Out of bounds</span>
      <h1>That page isn’t on the board.</h1>
      <p>The link may have moved, or the page may no longer be available.</p>
      <a href="/">Return home</a>
