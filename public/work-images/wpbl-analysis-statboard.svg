<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">WPBL first-month analysis table</title>
  <desc id="desc">An animated sports-stat table with ranked rows, opportunity bars, qualification markers, and early-signal trend lines.</desc>
  <style>
    .row { animation: row-in .55s cubic-bezier(.2,.75,.25,1) both; }
    .r1 { animation-delay: .08s; } .r2 { animation-delay: .16s; } .r3 { animation-delay: .24s; }
    .r4 { animation-delay: .32s; } .r5 { animation-delay: .40s; }
    .bar { transform-box: fill-box; transform-origin: left center; animation: bar-grow .8s cubic-bezier(.2,.75,.25,1) both; }
    .trace { stroke-dasharray: 900; stroke-dashoffset: 900; animation: trace 1.8s .4s ease-out forwards; }
    .qualifier { animation: pulse 1.9s ease-in-out infinite; }
    @keyframes row-in { from { opacity: 0; transform: translateX(-34px); } to { opacity: 1; transform: translateX(0); } }
    @keyframes bar-grow { from { transform: scaleX(.05); } to { transform: scaleX(1); } }
    @keyframes trace { to { stroke-dashoffset: 0; } }
    @keyframes pulse { 0%,100% { opacity: .45; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .row,.bar,.trace,.qualifier { animation: none; } }
  </style>

  <rect width="1600" height="1000" fill="#DCE9E3"/>
  <path d="M0 0H1600V88H0Z" fill="#2C173A"/>
  <rect x="0" y="88" width="16" height="912" fill="#B9533E"/>
  <text x="92" y="58" font-family="Arial,sans-serif" font-size="24" font-weight="800" letter-spacing="6" fill="#FFF8ED">WPBL DATA DESK / 01</text>
  <text x="100" y="180" font-family="Arial,sans-serif" font-size="34" font-weight="800" letter-spacing="5" fill="#356B5D">DATA ANALYSIS</text>
  <text x="100" y="305" font-family="Georgia,serif" font-size="104" fill="#2C173A">The first month</text>
  <g transform="translate(1125 140) rotate(2)">
    <rect width="360" height="130" rx="8" fill="#FFF8ED" stroke="#2C173A" stroke-width="4"/>
    <text x="24" y="42" font-family="Arial,sans-serif" font-size="20" font-weight="800" letter-spacing="3" fill="#B9533E">THE QUESTION</text>
    <text x="24" y="80" font-family="Georgia,serif" font-size="30" fill="#2C173A">Signal—or small sample?</text>
    <path d="M245 106c28-18 52-18 82-4" fill="none" stroke="#B9533E" stroke-width="4" stroke-linecap="round"/>
  </g>

  <g transform="translate(100 355)">
    <rect width="1400" height="545" rx="24" fill="#FFF8ED" stroke="#2C173A" stroke-width="4"/>
    <path d="M0 88H1400" stroke="#2C173A" stroke-width="3"/>
    <text x="32" y="55" font-family="Arial,sans-serif" font-size="22" font-weight="800" letter-spacing="3" fill="#5A3474">RANK</text>
    <text x="180" y="55" font-family="Arial,sans-serif" font-size="22" font-weight="800" letter-spacing="3" fill="#5A3474">OPPORTUNITY</text>
    <text x="760" y="55" font-family="Arial,sans-serif" font-size="22" font-weight="800" letter-spacing="3" fill="#5A3474">RATE</text>
    <text x="1065" y="55" font-family="Arial,sans-serif" font-size="22" font-weight="800" letter-spacing="3" fill="#5A3474">EARLY SIGNAL</text>

    <g class="row r1" transform="translate(0 104)">
      <circle cx="65" cy="38" r="28" fill="#5A3474"/><text x="65" y="47" text-anchor="middle" font-family="Georgia,serif" font-size="28" fill="#FFF8ED">01</text>
      <rect x="180" y="23" width="500" height="30" rx="15" fill="#EADFF0"/><rect class="bar" x="180" y="23" width="455" height="30" rx="15" fill="#5A3474"/>
      <circle cx="810" cy="38" r="19" fill="#B9533E"/><path d="M802 39l7 7 13-17" fill="none" stroke="#FFF8ED" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M1055 52l55-22 52 12 55-30 52 21 68-26" fill="none" stroke="#B9533E" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <path d="M22 194H1378" stroke="#D9CCBF" stroke-width="2"/>

    <g class="row r2" transform="translate(0 199)">
      <circle cx="65" cy="38" r="28" fill="#B9533E"/><text x="65" y="47" text-anchor="middle" font-family="Georgia,serif" font-size="28" fill="#FFF8ED">02</text>
      <rect x="180" y="23" width="500" height="30" rx="15" fill="#F3D8CF"/><rect class="bar" x="180" y="23" width="390" height="30" rx="15" fill="#B9533E"/>
      <circle cx="810" cy="38" r="19" fill="#C6923A"/><path d="M801 38h18" stroke="#FFF8ED" stroke-width="5" stroke-linecap="round"/>
      <path d="M1055 48l55-8 52-24 55 18 52-10 68 12" fill="none" stroke="#C6923A" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <path d="M22 289H1378" stroke="#D9CCBF" stroke-width="2"/>

    <g class="row r3" transform="translate(0 294)">
      <circle cx="65" cy="38" r="28" fill="#356B5D"/><text x="65" y="47" text-anchor="middle" font-family="Georgia,serif" font-size="28" fill="#FFF8ED">03</text>
      <rect x="180" y="23" width="500" height="30" rx="15" fill="#DCE9E3"/><rect class="bar" x="180" y="23" width="322" height="30" rx="15" fill="#356B5D"/>
      <circle cx="810" cy="38" r="19" fill="#356B5D"/><path d="M802 39l7 7 13-17" fill="none" stroke="#FFF8ED" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M1055 51l55-28 52 18 55-9 52 16 68-30" fill="none" stroke="#356B5D" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <path d="M22 384H1378" stroke="#D9CCBF" stroke-width="2"/>

    <g class="row r4" transform="translate(0 389)">
      <circle cx="65" cy="38" r="28" fill="#C6923A"/><text x="65" y="47" text-anchor="middle" font-family="Georgia,serif" font-size="28" fill="#FFF8ED">04</text>
      <rect x="180" y="23" width="500" height="30" rx="15" fill="#F0E4C9"/><rect class="bar" x="180" y="23" width="264" height="30" rx="15" fill="#C6923A"/>
      <circle cx="810" cy="38" r="19" fill="#C6923A"/><path d="M801 38h18" stroke="#FFF8ED" stroke-width="5" stroke-linecap="round"/>
      <path d="M1055 50l55-4 52-20 55 16 52-30 68 17" fill="none" stroke="#5A3474" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <path d="M22 479H1378" stroke="#D9CCBF" stroke-width="2"/>

    <g class="row r5" transform="translate(0 484)">
      <circle cx="65" cy="30" r="28" fill="#8F679F"/><text x="65" y="39" text-anchor="middle" font-family="Georgia,serif" font-size="28" fill="#FFF8ED">05</text>
      <rect x="180" y="15" width="500" height="30" rx="15" fill="#EADFF0"/><rect class="bar" x="180" y="15" width="210" height="30" rx="15" fill="#8F679F"/>
      <circle class="qualifier" cx="810" cy="30" r="19" fill="none" stroke="#B9533E" stroke-width="5"/><path d="M801 30h18" stroke="#B9533E" stroke-width="5" stroke-linecap="round"/>
      <path d="M1055 40l55-22 52 21 55-16 52 9 68-26" fill="none" stroke="#8F679F" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <path class="trace" d="M108 944c220 28 390-8 560 7 205 18 340-24 520-4 132 15 215 5 308-15" fill="none" stroke="#B9533E" stroke-width="5" stroke-linecap="round"/>
  <text x="104" y="978" font-family="Arial,sans-serif" font-size="22" font-weight="800" letter-spacing="3" fill="#5A3474">EARLY SAMPLE · QUALIFICATION MATTERS · CONTEXT BEFORE CONCLUSIONS</text>
</svg>
